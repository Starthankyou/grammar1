<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S1｜電話、時間、年齡與序數、祈使句</title>
<meta name="description" content="陳家的週末：讀懂六張生活文件＋會考題型">
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box}
body{margin:0;background:#e9e7e2;font-family:"PingFang TC","Noto Sans TC",sans-serif;color:#222;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;margin:10mm auto;background:#fff;padding:12mm 13mm 10mm;overflow:hidden;display:flex;flex-direction:column}
@media print{body{background:#fff}.page{margin:0;break-after:page}}
@media screen and (max-width:820px){.page{width:auto;height:auto;margin:0 0 12px;padding:18px 16px}}
.en{font-family:Georgia,"Times New Roman",serif}
nav{max-width:210mm;margin:10px auto 0;font-size:14px}nav a{color:#2d4a5e}
@media print{nav{display:none}}
header{border-bottom:2px solid #2d4a5e;padding-bottom:6px;margin-bottom:10px}
header small{color:#6a6a8a;font-size:11px;letter-spacing:.05em}
header h1{margin:2px 0 2px;font-size:22px;color:#1f3444}
header p{margin:0;font-size:12.5px;color:#555}
.rules{border:1.5px solid #2d4a5e;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:12.5px}
.rules b.h{display:block;color:#2d4a5e;margin-bottom:4px;font-size:13px}
.rules ol{margin:0;padding-left:20px;line-height:1.75}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media screen and (max-width:820px){.grid{grid-template-columns:1fr}}
.doc{position:relative;padding:12px 14px;font-size:13.5px;line-height:1.55}
.doc.wide{grid-column:1/-1}
.tag{position:absolute;top:-9px;left:12px;background:#2d4a5e;color:#fff;font-size:11px;padding:1px 8px;border-radius:10px}
.note{font-size:11.5px;color:#666;margin-bottom:4px}
/* call 對話 */
.call{border:1.5px solid #9bb0bf;border-radius:10px;background:#f4f8fb}
.call p{margin:2px 0;display:flex;gap:6px}.call p b{flex:0 0 auto;min-width:62px}
/* memo 留言條 */
.memo{background:#fff8d6;border:1.5px solid #d9c46a;box-shadow:2px 3px 0 #e5d78f}
.memo .mh{font-weight:700;letter-spacing:.12em;text-align:center;border-bottom:2px solid #c9b04a;padding-bottom:3px;margin-bottom:6px;font-size:13px}
.memo .f{display:flex;gap:6px;border-bottom:1px dotted #bba851;padding:1px 0}
.memo .f span:first-child{color:#7a6a20;font-size:11.5px;min-width:44px;font-family:inherit}
.memo .msg{margin-top:5px;font-family:"Bradley Hand","Segoe Print",Georgia,serif;font-size:14px;line-height:1.5}
/* board 表格＋告示 */
.board{border:1.5px solid #333;border-radius:6px;background:#fff}
.board table{width:100%;border-collapse:collapse;font-size:13.5px;margin:2px 0 6px}
.board th{background:#333;color:#fff;font-weight:600;padding:3px 6px;text-align:left;font-size:12px}
.board td{border-bottom:1px solid #ccc;padding:3px 6px}
.board .title{font-weight:700;margin-bottom:4px}
.sign{border:1.5px dashed #b33;color:#a22;border-radius:4px;padding:4px 8px;font-size:13px}
/* card 卡片 */
.card{border:2px solid #b0726c;border-radius:12px;text-align:center;background:#fff4f2;outline:1px solid #e3b7b2;outline-offset:-7px}
.card .big{font-size:18px;font-weight:700;color:#8a3d36;margin:2px 0}
.card p{margin:3px 0}.card .small{font-size:12.5px;color:#555}
/* notice 公告 */
.notice{border:1.5px solid #4f6b3a;border-radius:4px;background:#f5f9f0}
.notice .nh{font-weight:700;color:#3c5a28;border-bottom:1.5px solid #8aa66f;margin-bottom:4px;padding-bottom:2px}
.notice ul{margin:4px 0 0;padding-left:18px}
.hint{font-size:11.5px;color:#777;margin-top:10px;text-align:center}
/* 背面 */
h2{font-size:15px;color:#1f3444;margin:0 0 6px;border-left:4px solid #2d4a5e;padding-left:8px}
h2.sec{margin-top:8px}
.qs{margin:0;padding:0;list-style:none}
.q{padding:3px 0 4px;border-bottom:1px solid #e4e4e4;font-size:13.5px}
.q .s{display:flex;gap:6px}.q .s .n{font-weight:700;color:#2d4a5e;min-width:18px}
.from,.src{font-size:11px;color:#fff;border-radius:8px;padding:0 6px;margin-left:4px;white-space:nowrap;align-self:center;font-family:"PingFang TC","Noto Sans TC",sans-serif}
.from{background:#8aa0b0}.src{background:#b0726c}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 4px;margin:2px 0 0 24px}
.opts.two{grid-template-columns:1fr 1fr}
.opts span{font-size:13px;border-radius:4px;padding:0 3px}
@media screen{.opts span{cursor:pointer}.opts span:hover{background:#eef3f6}.opts span.ok{background:#d9f0dc}.opts span.no{background:#f8dcdc;text-decoration:line-through}}
.blank{display:inline-block;width:28px;border-bottom:1px solid #333;margin:0 4px}
.check{margin-top:8px;border:1.5px solid #2d4a5e;border-radius:8px;padding:5px 12px;font-size:12px}
.ans{margin-top:auto;border-top:1.5px solid #2d4a5e;padding-top:6px;font-size:11.5px;line-height:1.6;color:#333}
@media screen and (max-width:820px){.opts{grid-template-columns:1fr 1fr}.ans{margin-top:14px}}
</style>
</head>
<body>
<nav><a href="../">← 目錄</a></nav>
<div id="app"></div>
<script>
/* ===== 講義資料：做新的一張時只改這一段（用 make_unit.mjs 套進來） =====
   文字裡用 `反引號` 包起來的部分會用英文字體排。
   文件 docs 的 style：call 對話／memo 留言條／board 表格＋告示／card 卡片／notice 公告；wide:true 佔滿一整列。
   題目 qs、exam：o 四個選項、a 答案（0 起算）、why 一句解析；qs 用 from 標出看哪張文件，exam 用 src 標來源（例如「106 會考」「模擬」）。 */
const DOC = {
  code: "S1",
  title: "電話、時間、年齡與序數、祈使句",
  desc: "陳家的週末：讀懂六張生活文件＋會考題型",
  kicker: "補給站 S1｜電話用語・時間・年齡與序數・祈使句",
  heading: "陳家的週末：六張生活文件",
  intro: "陳家這週末要搭火車去花蓮，參加奶奶的生日。下面是他們家這兩天出現的六樣東西。先讀懂規則，再看文件，背面的題目都從文件裡找答案。",
  rulesTitle: "看懂這六張文件，你只需要 5 件事",
  rules: [
    ["電話", "找人 `May I speak to…?`；本人接 `Speaking.`；請對方等一下 `Hold on, please.`；打錯 `You have the wrong number.`"],
    ["15 分和 30 分", "`a quarter past seven`＝7:15；`a quarter to nine`＝8:45；`half past nine`＝9:30"],
    ["錶快、錶慢", "`fast`＝錶上的時間比真的多；`slow`＝比真的少"],
    ["年齡與第幾", "`eighty years old`；名詞前面變 `an eighty-year-old woman`（不加 s）；第八十個生日 `eightieth birthday`"],
    ["祈使句", "原形動詞開頭（`Stand…`）；「不要…」用 `Don't＋原形`"]
  ],
  docs: [
    {id: "A", label: "一通電話", style: "call", note: "Friday, 7:15 p.m.　陳家的電話響了，接電話的是兒子 Ben。", lines: [
      ["Ms. Lin", "Hello. May I speak to Mr. Chen?"],
      ["Ben", "Sorry, he isn't home. Who's this?"],
      ["Ms. Lin", "This is Amy Lin from Sunny Travel."],
      ["Ben", "Hold on, please. I need a pen."],
      ["Ms. Lin", "Your train tickets are ready."]
    ]},
    {id: "B", label: "Ben 寫的留言條", style: "memo", head: "WHILE YOU WERE OUT", fields: [
      ["To", "Dad"], ["From", "Ms. Amy Lin, Sunny Travel"], ["When", "Fri., May 2nd, a quarter past seven"]
    ], msg: "Our train leaves at a quarter to nine tomorrow. Get the tickets at Gate 3. Call her back: 2246-7180. — Ben"},
    {id: "C", label: "車站時刻表", style: "board", head: "Taipei → Hualien　Saturday", rows: [
      ["Train", "Leaves", "Arrives"], ["402", "8:15", "10:30"], ["408", "8:45", "11:00"], ["412", "9:30", "11:50"]
    ], sign: ["⚠ Stand behind the yellow line.", "Don't run on the stairs."]},
    {id: "D", label: "生日邀請卡", style: "card", top: "You're invited!", big: "Grandma Chen's 80th Birthday",
      body: ["Saturday, May 3rd · 12:30 p.m.", "Ocean Restaurant, Hualien"], bottom: "Don't bring gifts. Just bring a big smile!"},
    {id: "E", label: "Ben 書包裡的學校公告", style: "notice", head: "NOTICE · English Speech Contest", fields: [
      ["When", "Friday, May 9th, half past two – a quarter to four"], ["Where", "Room 302"]
    ], bullets: ["Be on time.", "Bring your student card.", "Don't use your phone in the room."]},
    {id: "F", label: "又一通電話", style: "call", note: "Saturday, 7:30 a.m.　出門前，電話又響了。", lines: [
      ["Man", "Hello. Is this 2246-7180?"],
      ["Ben", "No. This is 2246-7108."],
      ["Ben", "Sorry, you have the wrong number."],
      ["Man", "Oh, sorry. Thank you."]
    ]}
  ],
  qs: [
    {s: "If Mr. Chen answered the phone, he would say, “____”", o: ["Speaking.", "Hold on, please.", "Who's this?", "He isn't home."], a: 0, from: "A", why: "本人接電話說 Speaking.（我就是）。"},
    {s: "Ben says “Hold on, please.” He wants Ms. Lin to ____.", o: ["call back later", "wait a moment", "speak louder", "call Dad"], a: 1, from: "A", why: "Hold on＝請稍等，Ben 要去拿筆。"},
    {s: "Ben wrote the message at ____.", o: ["7:15", "7:45", "6:45", "7:30"], a: 0, from: "B", why: "a quarter past seven＝7:15。"},
    {s: "The Chens' train leaves at ____.", o: ["8:15", "9:15", "8:45", "9:45"], a: 2, from: "B", why: "a quarter to nine＝8:45。"},
    {s: "Which train will the Chens take?", o: ["Train 402", "Train 408", "Train 412", "None of them"], a: 1, from: "B＋C", why: "8:45 開的是 408 次。"},
    {s: "On Saturday, Dad's watch says 8:50. But his watch is ten minutes fast. The real time is ____.", o: ["8:40", "9:00", "8:50", "8:45"], a: 0, from: "C", why: "錶快十分鐘，真的時間要減掉：8:50－10＝8:40。"},
    {s: "So, can the Chens still catch their train?", o: ["No. It left five minutes ago.", "Yes. They have five minutes.", "Yes. They have twenty minutes.", "No. They must take Train 402."], a: 1, from: "C", why: "8:40 到 8:45 還有五分鐘。"},
    {s: "Which sentence is right for a station sign?", o: ["Not run on the stairs.", "Don't running on the stairs.", "Don't run on the stairs.", "No run on the stairs."], a: 2, from: "C", why: "否定祈使句：Don't＋原形動詞。"},
    {s: "On Saturday, Grandma is an eighty-____ woman.", o: ["years-old", "year old", "year-old", "years old"], a: 2, from: "D", why: "放在名詞前：eighty-year-old，year 不加 s。"},
    {s: "It is Grandma's ____ birthday.", o: ["eightieth", "eighty", "eightyth", "eighteenth"], a: 0, from: "D", why: "第八十個：eighty → eightieth（y 改 ie 加 th）。"},
    {s: "The speech contest is ____ long.", o: ["half an hour", "one hour", "an hour and a quarter", "two hours"], a: 2, from: "E", why: "2:30 到 3:45＝一小時又十五分。"},
    {s: "Look at the phone number. Who did the man really want to call?", o: ["Grandma", "Ben's school", "Ocean Restaurant", "Sunny Travel"], a: 3, from: "F＋B", why: "2246-7180 是留言條上旅行社的號碼。"}
  ],
  examTitle: "會考題型｜換個情境也會嗎？",
  exam: [
    {s: "____ a map with you when you go to a place for the first time.", o: ["Have taken", "Take", "Taking", "To take"], a: 1, src: "106 會考", why: "祈使句用原形動詞開頭。"},
    {s: "Ann: Hello. May I speak to Tom?　Tom: ____", o: ["Hold on, please.", "He isn't here.", "Speaking.", "Wrong number."], a: 2, src: "模擬", why: "本人接：Speaking."},
    {s: "It's 7:45 now. The movie starts at a quarter past eight. We have ____ minutes.", o: ["fifteen", "twenty", "thirty", "forty-five"], a: 2, src: "模擬", why: "7:45 到 8:15＝30 分鐘。"},
    {s: "My sister just started first grade. She is a ____ girl.", o: ["six-year-old", "six-years-old", "six years old", "sixth-year-old"], a: 0, src: "模擬", why: "名詞前：six-year-old，不加 s。"}
  ],
  check: "錯的題目回正面，找出是 5 件事裡的哪一件：① 電話 ② 15／30 分 ③ 錶快慢 ④ 年齡與第幾 ⑤ 祈使句。我錯最多的是第＿＿件。"
};
/* ===== 以下是版型，做新的一張不用改 ===== */
const L = ["A","B","C","D"];
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const tx = s => esc(s).replace(/`([^`]+)`/g, '<span class="en">$1</span>');
const docHTML = d => {
  const tag = `<span class="tag">文件 ${d.id}｜${esc(d.label)}</span>`, note = d.note ? `<div class="note">${tx(d.note)}</div>` : "";
  let body = "";
  if (d.style === "call") body = `<div class="en">${d.lines.map(([w, t]) => `<p><b>${esc(w)}:</b><span>${esc(t)}</span></p>`).join("")}</div>`;
  if (d.style === "memo") body = `<div class="mh en">${esc(d.head)}</div>${d.fields.map(([k, v]) => `<div class="f"><span>${esc(k)}</span><span class="en">${esc(v)}</span></div>`).join("")}<div class="msg">${esc(d.msg)}</div>`;
  if (d.style === "board") body = `<div class="title en">${esc(d.head)}</div><table class="en">${d.rows.map((r, i) => `<tr>${r.map(c => i ? `<td>${esc(c)}</td>` : `<th>${esc(c)}</th>`).join("")}</tr>`).join("")}</table>${d.sign ? `<div class="sign en">${d.sign.map(esc).join("<br>")}</div>` : ""}`;
  if (d.style === "card") body = `${d.top ? `<p class="en small">${esc(d.top)}</p>` : ""}<p class="en big">${esc(d.big)}</p><p class="en">${d.body.map(esc).join("<br>")}</p>${d.bottom ? `<p class="en small">${esc(d.bottom)}</p>` : ""}`;
  if (d.style === "notice") body = `<div class="nh en">${esc(d.head)}</div><div class="en">${d.fields.map(([k, v]) => `<b>${esc(k)}:</b> ${esc(v)}`).join("<br>")}</div>${d.bullets ? `<ul class="en">${d.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>` : ""}`;
  return `<div class="doc ${d.style}${d.wide ? " wide" : ""}">${tag}${note}${body}</div>`;
};
const qHTML = (q, n, badge) => {
  const two = q.o.some(o => o.length > 22) ? " two" : "";
  return `<li class="q" data-a="${q.a}"><div class="s"><span class="n">${n}.</span><span class="en">${esc(q.s)}</span>${badge}</div><div class="opts${two} en">${q.o.map((o, i) => `<span data-i="${i}">(${L[i]}) ${esc(o)}</span>`).join("")}</div></li>`;
};
function render(){
  const u = DOC, all = [...u.qs, ...u.exam];
  const front = `<div class="page"><header><small>${tx(u.kicker)}</small><h1>${tx(u.heading)}</h1><p>${tx(u.intro)}</p></header>
    <div class="rules"><b class="h">${tx(u.rulesTitle)}</b><ol>${u.rules.map(([h, t]) => `<li><b>${esc(h)}</b>：${tx(t)}</li>`).join("")}</ol></div>
    <div class="grid">${u.docs.map(docHTML).join("")}</div><p class="hint">翻到背面作答 →</p></div>`;
  const qs = `<h2>練習｜答案都在正面的文件裡</h2><ol class="qs">${u.qs.map((q, i) => qHTML(q, i + 1, `<span class="from">文件 ${esc(q.from)}</span>`)).join("")}</ol>`;
  const exam = u.exam.length ? `<h2 class="sec">${tx(u.examTitle)}</h2><ol class="qs">${u.exam.map((q, i) => qHTML(q, u.qs.length + i + 1, `<span class="src">${esc(q.src)}</span>`)).join("")}</ol>` : "";
  const check = u.check ? `<div class="check"><b>自己檢查</b>　${tx(u.check).replace("＿＿", '<span class="blank"></span>')}</div>` : "";
  const key = u.qs.map((q, i) => `${i + 1}.${L[q.a]}`).join("　") + (u.exam.length ? "　｜　" + (u.examLabel || "會考題型") + "　" + u.exam.map((q, i) => `${u.qs.length + i + 1}.${L[q.a]}`).join("　") : "");
  const ans = `<div class="ans"><b>答案</b>　${key}<br>${all.map((q, i) => `${i + 1}. ${tx(q.why)}`).join("　")}</div>`;
  document.getElementById("app").innerHTML = front + `<div class="page">${qs}${exam}${check}${ans}</div>`;
}
render();
// 網頁上點選項：馬上知道對錯（列印時不影響）
document.addEventListener("click", e => {
  const o = e.target.closest(".opts span"); if (!o) return;
  const q = o.closest(".q"), ok = +o.dataset.i === +q.dataset.a;
  o.classList.add(ok ? "ok" : "no");
});
</script>
</body>
</html>
