<style>

.tap-tip{font-size:13px;color:var(--sub);margin:4px 0}
.think{background:#fff6e3;border-radius:10px;padding:8px 14px;margin:10px 0}
.rule{margin:2px 0 6px}
.examples{display:grid;gap:6px;margin:6px 0 8px}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--soft);border-radius:8px;padding:7px 12px}

.opt .letter{font-weight:700;color:var(--accent);flex:none}
.opt:hover:not(:disabled){background:#edf7ff}

.opt.wrong{background:var(--warn);border-color:var(--warnline)}
.opt.correct{background:var(--ok);border-color:var(--okline)}
.opt:disabled{cursor:default}
.feedback{padding-left:30px;font-size:14px;color:#456a5f;margin-top:5px}

.vocab{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

.chunk{background:var(--soft);border-radius:8px;padding:7px 10px;font-size:14px;line-height:1.45}
.chunk b{font-family:Georgia,serif;font-size:15px}
.chunk i{display:block;font-family:Georgia,serif;font-style:normal;color:#234f6b}
#answers{margin-top:22px;border-top:2px solid var(--line);padding-top:8px}
#answers ol{padding-left:22px;margin:4px 0 10px}
.anskey{display:none}
ruby{ruby-position:over;ruby-align:center}
rt{font-size:10px;line-height:1;transform:translateY(.45em);color:#8a6d3b;font-family:"Noto Sans TC","PingFang TC",sans-serif;font-weight:400;letter-spacing:0}

.evidence .ptitle{font:700 16px Georgia,serif}
.evidence .ptext{font:15px/1.5 Georgia,serif;white-space:pre-line;margin-top:4px}

.cu-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}

.cu-grid ul{margin:2px 0 4px;padding-left:18px;font-size:14px}
.cu-grid li{margin:1px 0}
.caseupdate .next{margin:6px 0 0;font-size:14px;color:#7a5c2e;font-weight:700}

.series-nav{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin:0 0 14px}
.series-nav.bottom{margin:28px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.series-nav a{color:var(--accent);text-decoration:none;border:1px solid #b9cfdc;border-radius:7px;padding:5px 11px}

const UNIT = CASE;
/* ===== 以下是版型，做新單元不用改（新增一夜時，把 SERIES_LAST 改成最新的單元號碼） ===== */
const SERIES_LAST = 10;
const L = ["A","B","C","D"];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
// 生字小註解：資料裡寫 {{gold|金色的}}，畫面上 gold 上方會出現小字「金色的」；朗讀只念英文
const gl = s => esc(s).replace(/\{\{([^|{}]+)\|([^{}]+)\}\}/g, (_, w, z) => `<ruby>${w}<rt>${z}</rt></ruby>`);
const plain = s => s.replace(/\{\{([^|{}]+)\|[^{}]+\}\}/g, "$1");
const storyHTML = lines => lines.map(l=>`<div class="row"><button type="button" class="say" aria-label="朗讀這一句" title="朗讀">🔊</button><button type="button" class="line${l.f?" frame":""}" aria-expanded="false"><span class="en" data-say="${esc(plain(l.en))}">${esc(plain(l.en))}</span><span class="zh">${esc(l.zh)}</span></button></div>`).join("");
function qHTML(q, ci, qi){
  return `<div class="q" data-c="${ci}" data-q="${qi}"><div class="stem"><span class="qnum">${qi+1}.</span><span class="stem-text">${gl(q.s)}</span></div><div class="opts">${q.o.map((o,oi)=>`<button type="button" class="opt" data-o="${oi}"><span class="letter">(${L[oi]})</span><span>${esc(o)}</span></button>`).join("")}</div><div class="feedback" aria-live="polite"></div></div>`;
}
function evidenceHTML(p){
  if(!p) return "";
  const tbl = rs => `<table>${rs.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${gl(c)}</th>`:`<td>${gl(c)}</td>`).join("")}</tr>`).join("")}</table>`;
  let rows = "";
  if (p.rows && p.cols === 2) { const body = p.rows.slice(1), half = Math.ceil(body.length / 2); rows = `<div class="ev2">${tbl([p.rows[0], ...body.slice(0, half)])}${tbl([p.rows[0], ...body.slice(half)])}</div>`; }
  else if (p.rows) rows = tbl(p.rows);
  return `<section class="evidence"><span class="ptype">${esc(p.type || "證據")}</span><span class="ptitle">${gl(p.title || "")}</span>${p.text ? `<div class="ptext">${gl(p.text)}</div>` : ""}${rows}</section>`;
}
function conceptHTML(c, ci, from = 0, to = c.qs.length, cont = false){
  const kind = c.layout || ((c.qs[0].o.length > 3 || c.qs.some(q => q.o.some(o => plain(o).length > 14))) ? "long" : "short");
  const nopt = c.qs[0].o.length;
  if (from > 0 || cont) { let h = `<section class="concept ${kind} n${nopt}"><h2>${c.title.split("｜")[0]}（續）</h2>`; c.qs.slice(from, to).forEach((q,k)=>{ const qi = from + k; h += qHTML(q, ci, qi); }); return h + `</section>`; }
  let h = `<section class="concept ${kind} n${nopt}"><h2>${c.title}</h2><p class="rule">${esc(c.rule)}</p><div class="examples">${c.examples.map(e=>`<div class="ex"><span class="en">${esc(e[0])}</span><span class="zh">${esc(e[1])}</span></div>`).join("")}</div>${evidenceHTML(c.evidence)}`;
  c.qs.slice(0, to).forEach((q,qi)=>{ h += qHTML(q, ci, qi); });
  return h + `</section>`;
}
function navHTML(pos){
  const n = parseInt(UNIT.code.replace(/\D/g, ""), 10), local = location.pathname.endsWith(".html");
  const href = k => { const id = "m" + String(k).padStart(2, "0"); return local ? id + ".html" : "../" + id + "/"; };
  const home = local ? "../web/index.html" : "../";
  const prev = n > 1 ? `<a href="${href(n - 1)}">← 第 ${n - 1} 課</a>` : "";
  const next = n < SERIES_LAST ? `<a href="${href(n + 1)}">第 ${n + 1} 課 →</a>` : "";
  return `<nav class="series-nav ${pos}">${prev}<span class="gap"></span><a href="${home}">目錄</a><span class="gap"></span>${next}</nav>`;
}
function caseHTML(cu){
  const li = a => (a||[]).map(x=>`<li>${esc(Array.isArray(x) ? x[0] + "　→ " + x[1] : x)}</li>`).join("");
  return `<section class="caseupdate"><h2>案件更新｜Case Update</h2><div class="cu-grid">
    <div><b>✔ 已確認的事實</b><ul>${li(cu.facts)}</ul></div>
    <div><b>🔎 新線索</b><ul>${li(cu.clues)}</ul></div>
    <div><b>🤔 假設與評估</b><ul>${li(cu.hypotheses)}</ul></div>
    <div><b>❓ 還沒解決的問題</b><ul>${li(cu.questions)}</ul></div></div>
    ${cu.next ? `<p class="next">▶ 下一課：${esc(cu.next)}</p>` : ""}</section>`;
}
function render(){
  const u = UNIT, p = u.page2From ?? 2;
  const head = `<header><div class="eyebrow">${esc(u.caseLabel)}</div><h1>${esc(u.lessonLabel)}｜${esc(u.title)}</h1><p class="title-zh">${esc(u.subtitle || "")}</p></header>`;
  const front = `<section class="story"><div class="story-label">開場｜Opening Scene<button type="button" class="playall">🔊 全部播放</button></div>${storyHTML(u.opening)}<p class="tap-tip">按 🔊 聽英文。</p></section>`;
  const vocab = `<h2>Vocabulary｜10 個新單字</h2><div class="vocab">${u.vocab.map(v=>`<div class="word"><b>${v[0]}</b>${v[1]} ${v[2]}</div>`).join("")}</div>`;
  const chunks = u.chunks?.length ? `<h2>Chunks｜片語</h2><div class="chunks">${u.chunks.map(c=>`<div class="chunk"><b>${c[0]}</b> ${c[1]}<i>${esc(c[2])}</i></div>`).join("")}</div>` : "";
  const answers = `<section id="answers" hidden><h2>答案</h2>${u.concepts.map((c,ci)=>`<b>調查 ${ci+1}</b><ol>${c.qs.map(q=>`<li>(${L[q.a]}) ${esc(q.o[q.a])}　— ${esc(q.ok)}</li>`).join("")}</ol>`).join("")}</section>`;
  const anskey = `<div class="anskey"><b>答案</b>　${u.concepts.map((c,ci)=>`調查 ${ci+1}：${c.qs.map((q,qi)=>`${qi+1}.${L[q.a]}`).join(" ")}`).join("　｜　")}</div>`;
  // page2From：數字＝從第幾個觀念起放背面；[觀念, 題號]＝那個觀念從第幾題起放背面；[觀念, "qs"]＝說明和證據在正面、題目全部放背面
  const [pc, pq] = Array.isArray(p) ? p : [p, 0];
  let c1 = u.concepts.slice(0, pc).map((c,i)=>conceptHTML(c,i)).join(""), c2 = "";
  if (pq === "qs") { c1 += conceptHTML(u.concepts[pc], pc, 0, 0); c2 += conceptHTML(u.concepts[pc], pc, 0, undefined, true); }
  else if (pq > 0) { c1 += conceptHTML(u.concepts[pc], pc, 0, pq); c2 += conceptHTML(u.concepts[pc], pc, pq); }
  else if (pc < u.concepts.length) c2 += conceptHTML(u.concepts[pc], pc);
  c2 += u.concepts.slice(pc + 1).map((c,i)=>conceptHTML(c, pc + 1 + i)).join("");
  document.getElementById("lesson").innerHTML =
    `${navHTML("top")}<div class="page">${head}${front}${c1}</div>` +
    `<div class="page">${c2}${caseHTML(u.caseUpdate)}${vocab}${chunks}${answers}${anskey}</div>${navHTML("bottom")}`;
}
const total = UNIT.concepts.reduce((n,c)=>n+c.qs.length,0);
let done = new Set(), tries = {};
const updateProgress = ()=>{ document.getElementById("progress").textContent = `完成 ${done.size} / ${total} 題`; };
document.addEventListener("click", e=>{
  const say = e.target.closest(".say"), all = e.target.closest(".playall");
  if(say){ speakRows([say.closest(".row")]); return; }
  if(all){ speakRows([...all.closest(".story").querySelectorAll(".row")]); return; }
  const line = e.target.closest(".line");
  if(line){ line.classList.toggle("show"); line.setAttribute("aria-expanded", line.classList.contains("show")); return; }
  const btn = e.target.closest(".opt"); if(!btn || btn.disabled) return;
  const qEl = btn.closest(".q"), ci = +qEl.dataset.c, qi = +qEl.dataset.q, key = ci+"-"+qi;
  const q = UNIT.concepts[ci].qs[qi], fb = qEl.querySelector(".feedback"), pick = +btn.dataset.o;
  qEl.querySelectorAll(".opt").forEach(b=>b.classList.remove("wrong"));
  if(pick === q.a){
    btn.classList.add("correct"); done.add(key);
    qEl.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    fb.textContent = "✓ 對了。" + q.ok; updateProgress();
  } else {
    tries[key] = (tries[key]||0) + 1; btn.classList.add("wrong");
    fb.textContent = tries[key] === 1 ? "再試一次。線索：" + q.h1 : "提示：" + q.h2;
  }
});
// 朗讀（手機、電腦內建語音，不用網路檔案）
let slow = false;
function speakRows(rows){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel(); document.querySelectorAll(".playing").forEach(x=>x.classList.remove("playing"));
  const voice = speechSynthesis.getVoices().find(v=>/^en(-|_)US/i.test(v.lang)) || speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));
  rows.forEach(row=>{
    const u = new SpeechSynthesisUtterance((row.querySelector(".en").dataset.say || row.querySelector(".en").textContent).replace(/[“”]/g,'"'));
    u.lang = "en-US"; u.rate = slow ? 0.7 : 0.95; if(voice) u.voice = voice;
    u.onstart = ()=>{ document.querySelectorAll(".playing").forEach(x=>x.classList.remove("playing")); row.classList.add("playing"); row.querySelector(".say").classList.add("playing"); };
    u.onend = ()=>{ row.classList.remove("playing"); row.querySelector(".say").classList.remove("playing"); };
    speechSynthesis.speak(u);
  });
}
if(!("speechSynthesis" in window)) document.documentElement.classList.add("nospeech");
document.getElementById("slowBtn").onclick = e=>{ slow = !slow; e.target.textContent = slow ? "🐇 正常速度" : "🐢 慢速朗讀"; };

document.getElementById("resetBtn").onclick = ()=>{ done.clear(); tries = {}; render(); updateProgress(); document.getElementById("ansBtn").textContent = "查看答案"; };
document.getElementById("ansBtn").onclick = e=>{ const a = document.getElementById("answers"); a.hidden = !a.hidden; e.target.textContent = a.hidden ? "查看答案" : "收起答案"; if(!a.hidden) a.scrollIntoView({behavior:"smooth"}); };
document.getElementById("printBtn").onclick = ()=>window.print();
// 列印時切換成雙面 A4 版面
// 某一面快超出 A4 時，只收緊那一面的行距（不縮字）
function fitPages(){
  document.querySelectorAll(".page").forEach(p=>{
    p.classList.remove("tight","tight2");
    const key = p.querySelector(".anskey"), reserve = (key ? key.offsetHeight + 6 : 0) + 6;
    const bottom = () => Math.max(...[...p.children].filter(k=>!k.classList.contains("anskey") && getComputedStyle(k).display!=="none").map(k=>k.getBoundingClientRect().bottom)) - p.getBoundingClientRect().top;
    const SAFE = 44; // 列印時字會比螢幕寬一點，多留安全空間
    if (bottom() > p.clientHeight - reserve - 12 - SAFE) p.classList.add("tight");
    if (bottom() > p.clientHeight - reserve - SAFE) p.classList.add("tight2");
    p.dataset.over = Math.max(0, Math.round(bottom() - (p.clientHeight - reserve - SAFE)));
  });
}
const paperOn = ()=>{ document.body.classList.add("paper"); fitPages(); }, paperOff = ()=>document.body.classList.remove("paper");
addEventListener("beforeprint", paperOn); addEventListener("afterprint", paperOff);
matchMedia("print").addEventListener("change", m=>m.matches ? paperOn() : paperOff());
render();
if(location.hash === "#paper") paperOn();
